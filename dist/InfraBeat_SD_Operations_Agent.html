<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraBeat · SD Operations Agent</title>
<meta name="description" content="InfraBeat SD operations agent — finds, explains and fixes SAP SD issues: blocked orders, billing backlog, deliveries and PGI, outputs and IDocs, PO capture, credit blocks, accounting release, pricing.">
<style>
/* InfraBeat SD Operations Agent — theme aligned with the InfraBeat Procurement dashboard (SAP Fiori-like) */
:root{
  --bg:#f5f6f7; --card:#ffffff; --line:#e3e6ea; --line2:#eef0f3;
  --ink:#1d2d3e; --ink2:#32363a; --mute:#6a6d70; --mute2:#8d9096;
  --blue:#0a6ed1; --blue2:#0854a0; --blue-bg:#e8f1fb;
  --navy:#0d2a4d; --navy2:#12386b; --navy-ink:#dbe6f5;
  --red:#bb0000; --red2:#d0021b; --red-bg:#fdecec;
  --amber:#e9730c; --amber-bg:#fff3e6;
  --green:#107e3e; --green-bg:#e9f5ee;
  --purple:#6c3fb5; --purple-bg:#efe9fa;
  --chip:#eef0f3; --chip-ink:#32363a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(29,45,62,.06);
  --radius:10px;
  --font:"72","72full","Segoe UI",Inter,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#12171d; --card:#1b2129; --line:#2a323c; --line2:#242b34;
  --ink:#eef2f6; --ink2:#dde3ea; --mute:#9aa4b1; --mute2:#7d8793;
  --blue:#4db1ff; --blue2:#79c4ff; --blue-bg:#15283a;
  --navy:#0b1e36; --navy2:#102c52; --navy-ink:#c8d6ea;
  --red:#ff6b6b; --red2:#ff8080; --red-bg:#3a1b1b;
  --amber:#ffa54d; --amber-bg:#3a2a16;
  --green:#5dd28a; --green-bg:#163626;
  --purple:#b79cf0; --purple-bg:#2a2140;
  --chip:#262e38; --chip-ink:#dde3ea;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--ink)}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.mute{color:var(--mute)}.small{font-size:12px}.tiny{font-size:11px}
.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}.blue{color:var(--blue)}
.b{font-weight:700}.sb{font-weight:600}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1}.right{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:6px}

/* ---------- shell ---------- */
.top{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{font-weight:800;font-size:20px;letter-spacing:-.3px;color:var(--navy);padding-right:12px;border-right:2px solid var(--line)}
[data-theme="dark"] .logo .mark{color:#fff}
.logo .mark span{color:var(--red2)}
.logo .co{font-weight:700;font-size:13.5px;line-height:1.15}
.logo .sub{font-size:11.5px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;white-space:nowrap}
.pill:hover{border-color:var(--blue)}
.pill.ask{background:var(--red);border-color:var(--red);color:#fff}
.pill.ask:hover{background:var(--red2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-bg);color:var(--blue2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.tabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:56px;z-index:29;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--mute);padding:11px 8px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:7px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab .ic{width:14px;height:14px;opacity:.85}
.badge{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
.badge.r{background:var(--red-bg);color:var(--red)}
.badge.a{background:var(--amber-bg);color:var(--amber)}
.main{padding:18px;max-width:1500px;margin:0 auto}

/* ---------- hero ---------- */
.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:14px;padding:22px 26px;display:grid;grid-template-columns:1fr 230px;gap:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 60%)}
.hero .stamp{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600}
.hero .stamp i{width:7px;height:7px;border-radius:50%;background:#4dd6a8;display:inline-block}
.hero h1{color:#fff;font-size:22px;margin:12px 0 6px;letter-spacing:-.2px}
.hero p{margin:0;color:var(--navy-ink);max-width:760px}
.hero .top3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.hero .top3 button{text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.hero .top3 button:hover{background:rgba(255,255,255,.14)}
.hero .top3 .n{width:20px;height:20px;border-radius:50%;background:var(--red2);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.hero .top3 .n.a{background:var(--amber)}.hero .top3 .n.b{background:var(--blue)}
.hero .top3 .t{font-weight:700;font-size:12.5px}.hero .top3 .d{font-size:11.5px;color:var(--navy-ink)}
.hero .ring{display:flex;align-items:center;gap:14px;align-self:center}
.hero .ring svg{width:92px;height:92px}
.hero .ring .k{font-size:22px;font-weight:800;line-height:1}
.hero .ring .l{font-size:12px;color:var(--navy-ink);margin-top:4px}
.hero .ring a{color:#9cc8ff;font-weight:600;font-size:12px}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-top:14px}
@media (max-width:1280px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 10px;min-height:128px;position:relative;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:var(--blue)}
.tile .ic{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px}
.tile .ic svg{width:14px;height:14px}
.tile .ic.r{background:var(--red-bg);color:var(--red)}.tile .ic.a{background:var(--amber-bg);color:var(--amber)}.tile .ic.b{background:var(--blue-bg);color:var(--blue)}.tile .ic.g{background:var(--green-bg);color:var(--green)}.tile .ic.p{background:var(--purple-bg);color:var(--purple)}
.tile .lbl{font-size:12px;color:var(--mute)}
.tile .num{font-size:26px;font-weight:800;line-height:1.1;margin:2px 0}
.tile .s1{font-size:12px;color:var(--ink2)}.tile .s2{font-size:11.5px;font-weight:600;max-width:62%;line-height:1.3}
.tile .spark{position:absolute;right:0;bottom:0;width:42%;height:30px;opacity:.9}

/* ---------- cards / tables ---------- */
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:14px}.card .hd .sub{font-size:12px;color:var(--mute)}
.card .hd .ic{width:28px;height:28px;border-radius:7px;background:var(--amber-bg);color:var(--amber);display:inline-flex;align-items:center;justify-content:center}
.card .hd .ic svg{width:14px;height:14px}
.card .bd{padding:14px 16px}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--bg);white-space:nowrap}
[data-theme="dark"] table.t th{background:#161c23}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--blue-bg)}
table.t .k{font-weight:700;color:var(--ink)}table.t .k2{font-size:11.5px;color:var(--mute);margin-top:2px}
table.t td.r{text-align:right}table.t th.r{text-align:right}
.chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.chip.r{background:var(--red-bg);color:var(--red)}.chip.a{background:var(--amber-bg);color:var(--amber)}.chip.g{background:var(--green-bg);color:var(--green)}.chip.b{background:var(--blue-bg);color:var(--blue2)}.chip.p{background:var(--purple-bg);color:var(--purple)}
[data-theme="dark"] .chip.b{color:var(--blue)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--red);color:#fff}
.tag.a{background:var(--amber)}.tag.g{background:var(--green)}.tag.b{background:var(--blue)}
.bar{height:6px;background:var(--line2);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--red);border-radius:999px}
.bar i.a{background:var(--amber)}.bar i.g{background:var(--green)}.bar i.b{background:var(--blue)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
.list li:last-child{border-bottom:0}
.list .n{width:22px;height:22px;border-radius:50%;background:var(--red-bg);color:var(--red);font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.list .n.a{background:var(--amber-bg);color:var(--amber)}.list .n.b{background:var(--blue-bg);color:var(--blue)}
.list .t{font-weight:700}.list .d{font-size:12px;color:var(--mute)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:7px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:var(--blue2);border-color:var(--blue2);color:#fff}
.btn.d{background:var(--red);border-color:var(--red);color:#fff}.btn.d:hover{background:var(--red2)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--blue);padding:0}

/* ---------- page header / toolbar ---------- */
.ph{display:flex;align-items:flex-end;gap:14px;margin:4px 0 14px}
.ph h2{font-size:19px}.ph .sub{color:var(--mute);font-size:12.5px;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;min-width:300px}
.search input{border:0;background:none;padding:8px 0;flex:1}
.search input:focus{box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 11px;font-weight:600;color:var(--mute);font-size:12.5px}
.seg button.on{background:var(--blue-bg);color:var(--blue2)}
.note{border-left:3px solid var(--blue);background:var(--blue-bg);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;margin:10px 0}
.note.r{border-color:var(--red);background:var(--red-bg)}.note.a{border-color:var(--amber);background:var(--amber-bg)}.note.g{border-color:var(--green);background:var(--green-bg)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600}
.empty{padding:34px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* ---------- drawer / modal / toast ---------- */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,96vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.drawer.open{transform:none}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dh h3{font-size:15px}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(13,27,45,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(13,27,45,.45)}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:12px;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.modal .mb{padding:16px 18px}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s ease}
[data-theme="dark"] .toast{background:#eef2f6;color:#12171d}
.toast.err{background:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- flow / evidence ---------- */
.flow{display:flex;align-items:stretch;gap:0;margin:8px 0 14px;overflow:auto}
.flow .st{flex:1;min-width:0;border:1px solid var(--line);border-left:0;padding:8px 8px;position:relative;background:var(--card)}
.flow .st:first-child{border-left:1px solid var(--line);border-radius:8px 0 0 8px}.flow .st:last-child{border-radius:0 8px 8px 0}
.flow .st .l{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .st .v{font-weight:700;font-size:12px;margin-top:2px;word-break:break-word}
.flow .st .m{font-size:11px;color:var(--mute)}
.flow .st.ok{border-top:3px solid var(--green)}.flow .st.warn{border-top:3px solid var(--amber)}.flow .st.bad{border-top:3px solid var(--red)}.flow .st.todo{border-top:3px solid var(--line)}
.ev{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--bg)}
[data-theme="dark"] .ev{background:#161c23}
.ev .h{font-weight:700;font-size:12.5px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.ev pre{margin:0;white-space:pre-wrap;font-size:12px;color:var(--ink2)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:6px 0 6px 18px;position:relative;font-size:12.5px;border-left:2px solid var(--line2)}
.timeline li:before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.timeline li .w{color:var(--mute);font-size:11.5px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:13px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:3px}
[data-theme="dark"] .msg.a{background:#161c23}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--blue2)}
.sugg button:hover{border-color:var(--blue)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(120deg,var(--navy),var(--navy2))}
.login .box{background:var(--card);border-radius:14px;padding:28px 30px;width:min(420px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login h1{font-size:20px;margin:6px 0 2px}
.users{display:grid;gap:8px;margin-top:14px}
.users button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;text-align:left}
.users button:hover{border-color:var(--blue);background:var(--blue-bg)}
.users .nm{font-weight:700}.users .rl{font-size:12px;color:var(--mute)}

.footer{padding:18px;color:var(--mute2);font-size:11.5px;text-align:center}
@media (max-width:1000px){.hero{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.hero .top3{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}

/* icon sizing inside controls */
.btn svg,.pill svg,.search>svg,.dh h3 svg{width:14px;height:14px;flex:none}
.search>svg{color:var(--mute)}
.hero .ring svg text{font-family:var(--font)}

</style>
</head>
<body>
<div id="app"></div>
<div id="scrim" class="scrim" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer"></aside>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toasts" class="toasts"></div>
<script>
/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (v) => Number(v || 0).toLocaleString('en-IN');
const inr = (v) => { v = Number(v || 0); const a = Math.abs(v); if (a >= 1e7) return '₹' + (v / 1e7).toFixed(2) + ' cr'; if (a >= 1e5) return '₹' + (v / 1e5).toFixed(1) + ' L'; return '₹' + v.toLocaleString('en-IN'); };
const inrFull = (v) => '₹' + Number(v || 0).toLocaleString('en-IN');
const dmy = (d) => { if (!d) return '—'; const [y, m, dd] = d.split('-'); return `${dd} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m - 1]}`; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const ageDays = (d) => daysBetween(d, TODAY);
const addDays = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x.toISOString().slice(0, 10); };
const hoursAgo = (iso) => { const h = Math.max(0, Math.round((Date.now() - new Date(iso)) / 36e5)); return h < 1 ? 'just now' : h < 48 ? h + ' h' : Math.round(h / 24) + ' d'; };
const uid = () => Math.random().toString(36).slice(2, 9);
const sumBy = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);

/* =====================================================================
   SAP ADAPTER
   - mode 'mock' : works on the embedded tables (this file) — demo / offline
   - mode 'rfc'  : POSTs to the Python backend (backend/server.py) which
                   calls RFC_READ_TABLE / BAPIs through pyrfc, exactly like
                   the PP tool. The UI code never knows the difference.
   Every write goes through a named function module; nothing writes to a
   table directly (SD documents must be changed through BAPIs/FMs).
   ===================================================================== */
const SAP = {
  mode: 'mock',                 // 'mock' | 'rfc'
  endpoint: '/api/sap',         // backend route in rfc mode
  log: [],                      // call log shown in Data & connections

  /* ---- reads ---- */
  async read(table, where = {}, opts = {}) {
    const t0 = performance.now();
    let rows;
    if (this.mode === 'rfc') {
      rows = await this._post({ op: 'read', table, where, opts });
    } else {
      rows = (DB[table] || []).filter(r => Object.entries(where).every(([k, v]) => Array.isArray(v) ? v.includes(r[k]) : r[k] === v));
      rows = rows.map(r => ({ ...r }));
    }
    this._log('READ', table, where, rows.length, performance.now() - t0);
    return rows;
  },
  async one(table, where) { return (await this.read(table, where))[0] || null; },

  /* ---- writes: function module calls ---- */
  async call(fm, params = {}) {
    const t0 = performance.now();
    let res;
    if (this.mode === 'rfc') {
      res = await this._post({ op: 'call', fm, params });
    } else {
      const impl = MOCK_FM[fm];
      if (!impl) throw new Error(`Function module ${fm} is not implemented in mock mode`);
      res = impl(params);
      if (res.RETURN && res.RETURN.TYPE === 'E') { this._log('CALL', fm, params, 'ERROR: ' + res.RETURN.MESSAGE, performance.now() - t0); throw new Error(res.RETURN.MESSAGE); }
      MOCK_FM.BAPI_TRANSACTION_COMMIT();
    }
    this._log('CALL', fm, params, res.RETURN ? res.RETURN.MESSAGE : 'OK', performance.now() - t0);
    return res;
  },

  async _post(body) {
    const r = await fetch(this.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`SAP backend ${r.status}: ${await r.text()}`);
    return r.json();
  },
  _log(kind, name, params, result, ms) {
    this.log.unshift({ at: new Date().toISOString(), kind, name, params: JSON.stringify(params).slice(0, 160), result: String(result).slice(0, 160), ms: Math.round(ms) });
    if (this.log.length > 300) this.log.length = 300;
  },
};

/* ---------------------------------------------------------------------

const ok = (msg) => ({ RETURN: { TYPE: 'S', MESSAGE: msg } });
const err = (msg) => ({ RETURN: { TYPE: 'E', MESSAGE: msg } });
const nextNo = (table, field, start) => { const max = DB[table].reduce((m, r) => Math.max(m, parseInt(r[field], 10) || 0), start); return String(max + 1); };

const MOCK_FM = {
  BAPI_TRANSACTION_COMMIT() { persistDB(); return ok('Committed'); },

  /* ---- sales order ---- */
  BAPI_SALESORDER_CHANGE({ SALESDOCUMENT, ORDER_HEADER_IN = {}, ORDER_HEADER_INX = {}, LOGIC_SWITCH = {}, INCOMPLETE_FIELDS = [] }) {
    const o = DB.VBAK.find(r => r.VBELN === SALESDOCUMENT);
    if (!o) return err(`Sales document ${SALESDOCUMENT} does not exist`);
    if (ORDER_HEADER_INX.DLV_BLOCK) o.LIFSK = ORDER_HEADER_IN.DLV_BLOCK || '';
    if (ORDER_HEADER_INX.BILL_BLOCK) o.FAKSK = ORDER_HEADER_IN.BILL_BLOCK || '';
    if (ORDER_HEADER_INX.INCOTERMS1) { const kv = DB.KNVV.find(r => r.KUNNR === o.KUNNR); if (kv) kv.INCO1 = ORDER_HEADER_IN.INCOTERMS1; }
    INCOMPLETE_FIELDS.forEach(f => { DB.VBUV = DB.VBUV.filter(r => !(r.VBELN === SALESDOCUMENT && r.FDNAM === f)); });
    if (LOGIC_SWITCH.PRICING === 'B') { // carry out new pricing
      DB.VBAP.filter(i => i.VBELN === SALESDOCUMENT).forEach(i => {
        const rec = DB.A305.find(a => a.KUNNR === o.KUNNR && a.MATNR === i.MATNR && a.VKORG === o.VKORG && a.DATAB <= TODAY && a.DATBI >= TODAY) || DB.A304.find(a => a.MATNR === i.MATNR && a.VKORG === o.VKORG);
        if (rec) { i.NETPR = rec.KBETR; i.NETWR = rec.KBETR * i.KWMENG; }
        const pe = DB.PRCD_ELEMENTS.find(p => p.KNUMV === o.KNUMV && p.KPOSN === i.POSNR && p.KSCHL === 'PR00'); if (pe && rec) { pe.KBETR = rec.KBETR; pe.KWERT = i.NETWR; pe.STATUS = 'OK'; }
      });
      o.NETWR = DB.VBAP.filter(i => i.VBELN === SALESDOCUMENT).reduce((s, i) => s + i.NETWR, 0);
    }
    return ok(`Sales document ${SALESDOCUMENT} has been saved`);
  },
  BAPI_SALESORDER_CREATEFROMDAT2({ ORDER_HEADER_IN, ORDER_ITEMS_IN = [], ORDER_PARTNERS = [] }) {
    const dup = DB.VBAK.find(r => r.KUNNR === ORDER_HEADER_IN.KUNNR && r.BSTNK === ORDER_HEADER_IN.PURCH_NO_C);
    if (dup) return err(`V1 190: Purchase order ${ORDER_HEADER_IN.PURCH_NO_C} already exists in sales document ${dup.VBELN}`);
    const vbeln = nextNo('VBAK', 'VBELN', 50001303);
    const knumv = 'K' + vbeln.slice(-4);
    let netwr = 0;
    ORDER_ITEMS_IN.forEach((it, idx) => {
      const posnr = String((idx + 1) * 10).padStart(6, '0');
      const rec = DB.A305.find(a => a.KUNNR === ORDER_HEADER_IN.KUNNR && a.MATNR === it.MATERIAL && a.DATAB <= TODAY && a.DATBI >= TODAY) || DB.A304.find(a => a.MATNR === it.MATERIAL && a.VKORG === ORDER_HEADER_IN.SALES_ORG);
      const price = rec ? rec.KBETR : 0; const val = price * it.TARGET_QTY; netwr += val;
      DB.VBAP.push({ VBELN: vbeln, POSNR: posnr, MATNR: it.MATERIAL, KWMENG: it.TARGET_QTY, NETPR: price, NETWR: val, WERKS: it.PLANT, LGORT: '0001', ABGRU: '' });
      const st = DB.MARD.find(m => m.MATNR === it.MATERIAL && m.WERKS === it.PLANT); const conf = Math.min(it.TARGET_QTY, st ? st.LABST : 0);
      DB.VBEP.push({ VBELN: vbeln, POSNR: posnr, ETENR: '0001', EDATU: ORDER_HEADER_IN.REQ_DATE_H, WMENG: it.TARGET_QTY, BMENG: conf });
      DB.PRCD_ELEMENTS.push({ KNUMV: knumv, KPOSN: posnr, STUNR: '010', KSCHL: 'PR00', KBETR: price, KWERT: val, KINAK: '', KMPRS: '', STATUS: rec ? 'OK' : 'No condition record found' });
    });
    DB.VBAK.push({ VBELN: vbeln, AUART: ORDER_HEADER_IN.DOC_TYPE || 'OR', VKORG: ORDER_HEADER_IN.SALES_ORG, KUNNR: ORDER_HEADER_IN.KUNNR, BSTNK: ORDER_HEADER_IN.PURCH_NO_C, ERDAT: TODAY, VDATU: ORDER_HEADER_IN.REQ_DATE_H, NETWR: netwr, LIFSK: '', FAKSK: '', CMGST: '', GBSTK: 'A', KNUMV: knumv });
    return { ...ok(`Standard Order ${vbeln} has been saved`), SALESDOCUMENT: vbeln };
  },
  SD_ORDER_CREDIT_RELEASE({ VBELN }) { // VKM1 release
    const o = DB.VBAK.find(r => r.VBELN === VBELN); if (!o) return err('Document not found');
    o.CMGST = 'D'; return ok(`Credit release for ${VBELN} carried out (status D)`);
  },

  /* ---- delivery ---- */
  BAPI_OUTB_DELIVERY_CREATE_SLS({ SALES_ORDER_ITEMS = [], SHIP_POINT, DUE_DATE }) {
    const vbeln = nextNo('LIKP', 'VBELN', 80001303);
    const first = DB.VBAK.find(r => r.VBELN === SALES_ORDER_ITEMS[0].REF_DOC);
    const lines = []; let posnr = 10;
    for (const it of SALES_ORDER_ITEMS) {
      const ep = DB.VBEP.find(e => e.VBELN === it.REF_DOC && e.POSNR === it.REF_ITEM); const ap = DB.VBAP.find(a => a.VBELN === it.REF_DOC && a.POSNR === it.REF_ITEM);
      const qty = Math.min(it.DLV_QTY || ep.BMENG, ep.BMENG);
      if (qty <= 0) return err(`VL 150: No confirmed quantity for item ${it.REF_ITEM} of ${it.REF_DOC}`);
      lines.push({ VBELN: vbeln, POSNR: String(posnr).padStart(6, '0'), VGBEL: it.REF_DOC, VGPOS: it.REF_ITEM, MATNR: ap.MATNR, LFIMG: qty, WERKS: ap.WERKS, LGORT: ap.LGORT, CHARG: (DB.MCHB.find(b => b.MATNR === ap.MATNR && b.WERKS === ap.WERKS && b.CLABS >= qty) || {}).CHARG || 'B2611-09' });
      posnr += 10;
    }
    DB.LIKP.push({ VBELN: vbeln, LFART: 'LF', VSTEL: SHIP_POINT, KUNNR: first.KUNNR, LFDAT: DUE_DATE || TODAY, WADAT_IST: '', WBSTK: 'A', KOSTK: 'C', ERDAT: TODAY, PGI_ERR: '' });
    DB.LIPS.push(...lines); first.GBSTK = 'B';
    return { ...ok(`Delivery ${vbeln} created`), DELIVERY: vbeln };
  },
  BAPI_OUTB_DELIVERY_CHANGE({ DELIVERY, ITEM_DATA = [] }) { // used to assign batch
    ITEM_DATA.forEach(d => { const l = DB.LIPS.find(r => r.VBELN === DELIVERY && r.POSNR === d.DELIV_ITEM); if (l) l.CHARG = d.BATCH; });
    const h = DB.LIKP.find(r => r.VBELN === DELIVERY); if (h) h.PGI_ERR = '';
    return ok(`Delivery ${DELIVERY} changed`);
  },
  WS_DELIVERY_UPDATE({ VBELN }) { // post goods issue (BAPI_OUTB_DELIVERY_CONFIRM_DEC in production)
    const h = DB.LIKP.find(r => r.VBELN === VBELN); if (!h) return err('Delivery not found');
    const items = DB.LIPS.filter(r => r.VBELN === VBELN);
    for (const it of items) {
      if (!it.CHARG) { h.PGI_ERR = `VL 609: Batch determination failed — no batch assigned to item ${it.POSNR}`; return err(h.PGI_ERR); }
      const st = DB.MARD.find(m => m.MATNR === it.MATNR && m.WERKS === it.WERKS && m.LGORT === it.LGORT);
      if (!st || st.LABST < it.LFIMG) { h.PGI_ERR = `M7 021: Deficit of SL Unrestricted-use ${it.LFIMG} EA : ${it.MATNR} ${it.WERKS} ${it.LGORT}`; return err(h.PGI_ERR); }
    }
    items.forEach(it => { const st = DB.MARD.find(m => m.MATNR === it.MATNR && m.WERKS === it.WERKS && m.LGORT === it.LGORT); st.LABST -= it.LFIMG; });
    h.WBSTK = 'C'; h.WADAT_IST = TODAY; h.PGI_ERR = '';
    return ok(`Goods issue posted for delivery ${VBELN}`);
  },

  /* ---- billing ---- */
  BAPI_BILLINGDOC_CREATEMULTIPLE({ BILLINGDATAIN = [] }) {
    const created = [];
    for (const b of BILLINGDATAIN) {
      const dlv = DB.LIKP.find(r => r.VBELN === b.REF_DOC); if (!dlv) return err(`Delivery ${b.REF_DOC} not found`);
      if (dlv.WBSTK !== 'C') return err(`VF 044: Delivery ${b.REF_DOC} — goods issue not yet posted`);
      const lines = DB.LIPS.filter(r => r.VBELN === b.REF_DOC);
      const ord = DB.VBAK.find(r => r.VBELN === lines[0].VGBEL);
      if (ord.FAKSK) return err(`VF 042: Sales document ${ord.VBELN} is blocked for billing (${ord.FAKSK})`);
      const vbeln = nextNo('VBRK', 'VBELN', 90001303);
      let netwr = 0; const items = [];
      lines.forEach(l => { const ap = DB.VBAP.find(a => a.VBELN === l.VGBEL && a.POSNR === l.VGPOS); const val = ap.NETPR * l.LFIMG; netwr += val;
        items.push({ VBELN: vbeln, POSNR: l.POSNR, VGBEL: l.VBELN, VGPOS: l.POSNR, AUBEL: l.VGBEL, AUPOS: l.VGPOS, MATNR: l.MATNR, FKIMG: l.LFIMG, NETWR: val }); });
      // account determination check (VKOA) decides whether FI posting succeeds
      const gap = items.find(i => { const m = DB.MAKT.find(x => x.MATNR === i.MATNR); return !DB.VKOA.find(v => v.KTGRM === m.KTGRM && v.KVSL1 === 'ERL'); });
      const posted = !gap;
      DB.VBRK.push({ VBELN: vbeln, FKART: 'F2', FKDAT: TODAY, KUNRG: ord.KUNNR, VKORG: ord.VKORG, NETWR: netwr, MWSBK: Math.round(netwr * 0.18), RFBSK: posted ? 'C' : 'E', FKSTO: '', BELNR: posted ? nextNo('BKPF', 'BELNR', 1400022900) : '', ACC_ERR: posted ? '' : `KI 235: account determination (VKOA) for account key ERL / material account assignment group ${DB.MAKT.find(x => x.MATNR === gap.MATNR).KTGRM} returned no G/L account` });
      if (posted) DB.BKPF.push({ BELNR: DB.VBRK[DB.VBRK.length - 1].BELNR, AWKEY: vbeln, WRBTR: Math.round(netwr * 1.18), BUDAT: TODAY });
      DB.VBRP.push(...items); ord.GBSTK = 'C';
      DB.NAST.push({ KAPPL: 'V3', OBJKY: vbeln, KSCHL: 'RD00', NACHA: '5', VSTAT: '1', ERDAT: TODAY, PDEST: '', ERRTXT: '' });
      DB.EINV.push({ VBELN: vbeln, IRN_STATUS: 'GENERATED', ERRCODE: '', ERRTXT: '', SUBMITTED: TODAY });
      created.push(vbeln);
    }
    return { ...ok(`Billing document(s) ${created.join(', ')} saved`), SUCCESS: created };
  },
  RV_INVOICE_RELEASE_TO_ACCOUNTING({ VBELN }) { // VF02 → Release to accounting
    const inv = DB.VBRK.find(r => r.VBELN === VBELN); if (!inv) return err('Billing document not found');
    const items = DB.VBRP.filter(r => r.VBELN === VBELN);
    const gap = items.find(i => { const m = DB.MAKT.find(x => x.MATNR === i.MATNR); return !DB.VKOA.find(v => v.KTGRM === m.KTGRM && v.KVSL1 === 'ERL'); });
    if (inv.ACC_ERR.startsWith('FF 753') && !DB.TAXCODES_FIXED) return err(inv.ACC_ERR);
    if (gap) return err(inv.ACC_ERR || 'Account determination error');
    inv.RFBSK = 'C'; inv.ACC_ERR = ''; inv.BELNR = nextNo('BKPF', 'BELNR', 1400022900);
    DB.BKPF.push({ BELNR: inv.BELNR, AWKEY: VBELN, WRBTR: inv.NETWR + inv.MWSBK, BUDAT: TODAY });
    return ok(`Document ${VBELN} released to accounting — FI document ${inv.BELNR}`);
  },

  /* ---- output / EDI / e-invoice ---- */
  RSNAST00({ OBJKY, KSCHL, PDEST }) { // reprocess output
    const n = DB.NAST.find(r => r.OBJKY === OBJKY && r.KSCHL === KSCHL); if (!n) return err('Output record not found');
    if (n.NACHA === '5') { const inv = DB.VBRK.find(r => r.VBELN === OBJKY); const k = DB.KNA1.find(r => r.KUNNR === inv.KUNRG); if (!k.SMTP_ADDR) return err(n.ERRTXT); }
    if (n.NACHA === '1') { const dest = PDEST || n.PDEST; const p = DB.PRINTERS.find(r => r.PDEST === dest); if (!p || p.STATUS !== 'READY') return err(`Output device ${dest} not available`); n.PDEST = dest; }
    n.VSTAT = '1'; n.ERRTXT = ''; return ok(`Output ${KSCHL} for ${OBJKY} processed successfully`);
  },
  BAPI_CUSTOMER_CHANGEFROMDATA({ KUNNR, SMTP_ADDR, STCD3 }) {
    const k = DB.KNA1.find(r => r.KUNNR === KUNNR); if (!k) return err('Customer not found');
    if (SMTP_ADDR !== undefined) k.SMTP_ADDR = SMTP_ADDR; if (STCD3 !== undefined) { k.STCD3 = STCD3; k.GSTIN_OK = true; }
    return ok(`Customer ${KUNNR} changed`);
  },
  BD87_REPROCESS({ DOCNUM }) { // reprocess IDoc

    if (!DB.WE20.find(w => w.PARNUM === d.RCVPRN && w.MESTYP === d.MESTYP)) return err(d.STATXT);
    d.STATUS = '03'; d.STATXT = ''; return ok(`IDoc ${DOCNUM} passed to port (status 03)`);
  },
  WE20_CREATE_PARTNER_PROFILE({ PARNUM, PARTYP, MESTYP }) { DB.WE20.push({ PARNUM, PARTYP, MESTYP }); return ok(`Partner profile ${PARNUM}/${MESTYP} created`); },
  EINV_RESUBMIT({ VBELN }) {
    const e = DB.EINV.find(r => r.VBELN === VBELN); const inv = DB.VBRK.find(r => r.VBELN === VBELN); const k = DB.KNA1.find(r => r.KUNNR === inv.KUNRG);
    if (!k.GSTIN_OK) return err(`IRP ${e.ERRCODE}: ${e.ERRTXT}`);
    e.IRN_STATUS = 'GENERATED'; e.ERRCODE = ''; e.ERRTXT = ''; e.SUBMITTED = TODAY; return ok(`IRN generated for ${VBELN}`);

  /* ---- pricing & customising ---- */
  BAPI_PRICES_CONDITIONS({ KSCHL, VKORG, VTWEG, KUNNR, MATNR, DATAB, DATBI, KBETR }) {

  },
  VKOA_MAINTAIN({ KTGRM, KVSL1, SAKNR }) { DB.VKOA.push({ KTOPL: 'INT', KTGRM, KVSL1, SAKNR }); return ok(`VKOA: ${KTGRM}/${KVSL1} → G/L ${SAKNR} maintained (transport request created)`); },
  FTXP_MAINTAIN({ MWSKZ }) { DB.TAXCODES_FIXED = true; DB.VBRK.filter(v => v.ACC_ERR.startsWith('FF 753')).forEach(v => { /* error clears on release */ }); return ok(`Tax code ${MWSKZ} maintained in TAXINN`); },
  KNMT_CREATE({ KUNNR, VKORG, VTWEG, KDMAT, MATNR, UMREZ }) { DB.KNMT.push({ KUNNR, VKORG, VTWEG, KDMAT, MATNR, UMREZ }); return ok(`Customer-material info ${KDMAT} → ${MATNR} created`); },
};

/* ---- persistence of the mock DB (browser local storage) ---- */
const DB_KEY = 'infrabeat.sd.agent.db.v1';
let DB = null;
function loadDB() { try { const s = JSON.parse(localStorage.getItem(DB_KEY)); DB = s && s.VBAK ? s : JSON.parse(JSON.stringify(SAP_TABLES)); } catch { DB = JSON.parse(JSON.stringify(SAP_TABLES)); } }
function persistDB() { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch { /* storage unavailable: in-memory only */ } }
function resetDB() { DB = JSON.parse(JSON.stringify(SAP_TABLES)); try { localStorage.removeItem(DB_KEY); } catch {} }

  {

    async detect() {

const STATE_KEY = 'infrabeat.sd.agent.state.v1';
let S = { user: null, vkorg: 'all', theme: 'light', tab: 'overview', issues: {}, tasks: [], audit: [], actions: 0, minutes: 0, scannedAt: null, filter: 'open', q: '' };
let ISSUES = [];            // live merged issue list
let DRAWER = null;          // {type:'issue'|'order'|'chat', ...}
const LLM = { endpoint: '' }; // optional: POST {question, context} → {answer}; empty = built-in rule-based copilot

function loadState() { try { const s = JSON.parse(localStorage.getItem(STATE_KEY)); if (s && s.issues) S = { ...S, ...s }; } catch {} }
function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch {} }
const nowISO = () => new Date().toISOString();
const me = () => S.user;
const userName = (id) => (USERS.find(u => u.id === id) || CONSULTANTS.find(c => c.id === id) || { name: id }).name;
function audit(what, ref = '') { S.audit.unshift({ at: nowISO(), who: me() ? me().name : 'system', what, ref }); if (S.audit.length > 400) S.audit.length = 400; }

/* ---------- scanner ---------- */
async function scan() {
  const drafts = [];
  for (const c of CATALOG) {
    const defaults = { catalogId: c.id, catalogTitle: c.title, module: c.module, execRole: c.execRole, approval: c.approval, skill: c.skill, minutes: c.minutes };
    try { for (const d of await c.detect()) drafts.push({ ...defaults, ...d }); } catch (e) { console.error('detect failed', c.id, e); }
  }
  const seen = new Set();
  for (const d of drafts) {
    seen.add(d.key);
    if (!S.issues[d.key]) S.issues[d.key] = { key: d.key, status: 'open', createdAt: nowISO(), history: [{ at: nowISO(), who: 'Scanner', what: 'Detected: ' + d.title }] };
    const st = S.issues[d.key]; if (st.status === 'resolved' && !st.closedByTool) { st.status = 'open'; st.history.push({ at: nowISO(), who: 'Scanner', what: 'Re-detected: ' + d.title }); }
    st.snap = { title: d.title, detail: d.detail, module: d.module, ref: d.ref, kunnr: d.kunnr, vkorg: d.vkorg, value: d.value, refType: d.refType };
  }
  for (const [k, st] of Object.entries(S.issues)) if (!seen.has(k) && !['resolved', 'rejected'].includes(st.status)) { st.status = 'resolved'; st.resolvedAt = nowISO(); st.reason = st.reason || 'No longer reported by SAP'; st.history.push({ at: nowISO(), who: 'Scanner', what: 'Verified — SAP no longer reports this issue' }); }
  ISSUES = drafts.map(d => ({ ...d, ...S.issues[d.key] }));
  for (const [k, st] of Object.entries(S.issues)) if (!seen.has(k)) ISSUES.push({ ...(st.snap || {}), ...st, fix: null, evidence: [], explain: '' });
  S.scannedAt = nowISO(); saveState();
}
const inOrg = (i) => S.vkorg === 'all' || !i.vkorg || i.vkorg === S.vkorg;
const isLive = (i) => ['open', 'pending', 'approved', 'assigned'].includes(i.status);
const live = (mod) => ISSUES.filter(i => isLive(i) && inOrg(i) && (!mod || i.module === mod));
const syncIssues = () => ISSUES.forEach(i => { if (S.issues[i.key]) Object.assign(i, S.issues[i.key]); });
const issue = (key) => { const i = ISSUES.find(x => x.key === key); if (i && S.issues[key]) Object.assign(i, S.issues[key]); return i; };

/* ---------- permissions ---------- */
const role = () => ROLES[me().role];
const canExecute = (i) => role().execute.includes('*') || role().execute.includes(i.execRole) || i.assignee === me().id;
const canApprove = (i) => !!i.approval && role().approve.includes(i.approval) && i.proposedBy !== me().id;
const needsApproval = (i) => !!i.approval && i.status !== 'approved';
const canAssign = () => role().assign || me().role === 'cs';
const APPROVAL_LABEL = { block: 'SD Lead', billing_block: 'SD Lead', pricing: 'SD Lead', delivery: 'SD Lead', order: 'SD Lead', credit: 'Finance Controller', accounting: 'Finance Controller' };

/* ---------- actions ---------- */
function hist(i, what) { const st = S.issues[i.key]; st.history.push({ at: nowISO(), who: me().name, what }); }
function propose(key, note = '') { const i = issue(key); const st = S.issues[key]; st.status = 'pending'; st.proposedBy = me().id; st.proposedAt = nowISO(); st.note = note; hist(i, `Sent for ${APPROVAL_LABEL[i.approval]} approval: ${i.fix.label}${note ? ' — ' + note : ''}`); audit(`Proposed: ${i.fix.label}`, i.ref); saveState(); toast(`Sent to ${APPROVAL_LABEL[i.approval]} for approval`); refresh(); }
function decide(key, ok, note) { const i = issue(key); if (!canApprove(i)) return toast('You cannot approve this item', true); if (!note) return toast('A review reason is required', true); const st = S.issues[key]; st.status = ok ? 'approved' : 'rejected'; st.approvedBy = me().id; st.decisionNote = note; if (!ok) { st.reason = 'Rejected: ' + note; st.closedByTool = true; } hist(i, `${ok ? 'Approved' : 'Rejected'}: ${note}`); audit(`${ok ? 'Approved' : 'Rejected'}: ${i.fix ? i.fix.label : i.title}`, i.ref); saveState(); toast(ok ? 'Approved — ready to execute' : 'Rejected'); refresh(); }
function accept(key, note) { const i = issue(key); if (!(role().approve.includes(i.approval) || me().role === 'sdlead' || me().role === 'finance')) return toast('Only an approver can accept an issue as-is', true); const st = S.issues[key]; st.status = 'resolved'; st.resolvedAt = nowISO(); st.reason = 'Accepted as is: ' + note; st.closedByTool = true; hist(i, 'Accepted as is: ' + note); audit('Accepted as is', i.ref); saveState(); toast('Closed'); refresh(); }
function suggestConsultant(skill) { const load = consultantLoad(); return CONSULTANTS.filter(c => c.skills.includes(skill)).sort((a, b) => load[a.id] - load[b.id])[0] || CONSULTANTS.sort((a, b) => load[a.id] - load[b.id])[0]; }
function consultantLoad() { const l = { ...BASE_LOAD }; S.tasks.filter(t => t.status === 'open').forEach(t => { l[t.assignee] = (l[t.assignee] || 0) + 1; }); return l; }
function assign(key, cid, note) { const i = issue(key); const st = S.issues[key]; st.assignee = cid; if (st.status === 'open') st.status = 'assigned'; const title = (i.task && i.task.title) || i.title; S.tasks.unshift({ id: 'T-' + uid(), issueKey: key, title, assignee: cid, by: me().id, at: nowISO(), status: 'open', note }); hist(i, `Assigned to ${userName(cid)}${note ? ' — ' + note : ''}`); audit(`Assigned to ${userName(cid)}: ${title}`, i.ref); saveState(); toast(`Assigned to ${userName(cid)}`); refresh(); }
function taskDone(tid, note) { const t = S.tasks.find(x => x.id === tid); t.status = 'done'; t.doneAt = nowISO(); t.doneNote = note; const i = issue(t.issueKey); if (i) { hist(i, `Task completed by ${me().name}: ${note || ''}`); if (S.issues[t.issueKey].status === 'assigned') S.issues[t.issueKey].status = 'open'; } audit('Task completed: ' + t.title); saveState(); toast('Task marked done'); refresh(); }

async function execute(key, inputs = {}) {
  const i = issue(key);
  if (!i.fix) return toast('No automated fix for this issue', true);
  if (!canExecute(i)) return toast(`Your role cannot execute ${i.execRole} actions`, true);
  if (needsApproval(i)) return toast(`${APPROVAL_LABEL[i.approval]} approval is required first`, true);
  const st = S.issues[key]; let last = null; const done = [];
  try {
    for (const step of i.fix.steps) {
      const params = JSON.parse(JSON.stringify(step.params));
      for (const inp of [step.input, step.input2].filter(Boolean)) if (inputs[inp.name] !== undefined && inputs[inp.name] !== '') params[inp.name] = isNaN(inputs[inp.name]) ? inputs[inp.name] : Number(inputs[inp.name]);
      if (step.dynamic === 'po-lines') params.ORDER_ITEMS_IN = params.ORDER_ITEMS_IN.map(l => { if (l.MATERIAL) return l; const m = DB.KNMT.find(x => x.KUNNR === params.ORDER_HEADER_IN.KUNNR && x.KDMAT === l.KDMAT); return { ...l, MATERIAL: m ? m.MATNR : null, TARGET_QTY: l.CASES * (m ? m.UMREZ : 1) }; });
      if (step.dynamic === 'po-close' && last && last.SALESDOCUMENT) params.SALESDOCUMENT = last.SALESDOCUMENT;
      last = await SAP.call(step.fm, params); done.push(step.fm);
      hist(i, `${step.fm} → ${last.RETURN.MESSAGE}`);
    }
  } catch (e) { hist(i, `SAP error: ${e.message}`); audit(`Failed: ${i.fix.label} — ${e.message}`, i.ref); saveState(); toast('SAP: ' + e.message, true); refresh(); return; }
  await scan();
  const again = issue(key);
  if (again && isLive(again)) { S.issues[key].status = 'open'; hist(again, `Executed ${done.join(', ')}; SAP now reports: ${again.title}`); audit(`Executed: ${i.fix.label}`, i.ref); S.actions++; S.minutes += (MINUTES_SAVED[i.minutes] || 5); toast(`Done — next step: ${again.fix ? again.fix.label : 'review'}`); }
  else { const st2 = S.issues[key]; st2.status = 'resolved'; st2.resolvedAt = nowISO(); st2.reason = 'Fixed from here: ' + i.fix.label; st2.closedByTool = true; st2.history.push({ at: nowISO(), who: 'Scanner', what: 'Verified in SAP — issue cleared' }); S.actions++; S.minutes += (MINUTES_SAVED[i.minutes] || 5); audit(`Executed and verified: ${i.fix.label}`, i.ref); toast(`Done and verified in SAP${last && last.SALESDOCUMENT ? ' — order ' + last.SALESDOCUMENT : last && last.DELIVERY ? ' — delivery ' + last.DELIVERY : last && last.SUCCESS ? ' — invoice ' + last.SUCCESS.join(', ') : ''}`); }
  saveState(); closeDrawer(); refresh();
}
async function bulkExecute(keys) { for (const k of keys) { const i = issue(k); if (i && i.fix && !needsApproval(i) && canExecute(i)) await execute(k); } }

/* ---------- module pages ---------- */
const FILTERS = [['open', 'Open'], ['pending', 'Pending approval'], ['assigned', 'Assigned'], ['resolved', 'Resolved'], ['all', 'All']];
function listFor(mod) { let L = ISSUES.filter(i => i.module === mod && inOrg(i)); if (S.filter === 'open') L = L.filter(i => isLive(i)); else if (S.filter !== 'all') L = L.filter(i => i.status === S.filter || (S.filter === 'resolved' && i.status === 'rejected')); if (S.q) { const q = S.q.toLowerCase(); L = L.filter(i => [i.ref, i.title, i.detail, custName(i.kunnr)].join(' ').toLowerCase().includes(q)); } return L.sort((a, b) => (a.severity === 'r' ? 0 : 1) - (b.severity === 'r' ? 0 : 1) || b.value - a.value); }
function signal(i) {
  switch (i.module) {
    case 'tracker': return i.catalogId === 'SD-01' ? `<span class="chip r">Delivery block</span>` : i.catalogId === 'SD-02' ? `<span class="chip a">Incomplete</span>` : `<span class="chip a">Qty short</span>`;
    case 'billing': return i.approval ? `<span class="chip r">Billing block</span>` : `<span class="chip g">Clean — bill now</span>`;
    case 'delivery': return i.catalogId === 'SD-21' ? (i.severity === 'r' ? `<span class="chip r">PGI failed</span>` : `<span class="chip a">PGI pending</span>`) : (i.approval ? `<span class="chip a">Partial</span>` : `<span class="chip g">Create delivery</span>`);
    case 'output': return `<span class="chip ${i.catalogId === 'SD-30' ? 'a' : 'r'}">${{ 'SD-30': 'Output', 'SD-31': 'IDoc', 'SD-32': 'e-Invoice' }[i.catalogId]}</span>`;
    case 'po': return i.severity === 'g' ? `<span class="chip g">Ready</span>` : i.severity === 'a' ? `<span class="chip a">Mapping needed</span>` : `<span class="chip r">Duplicate</span>`;
    case 'credit': return i.recommend === 'release' ? `<span class="chip g">Recommend release</span>` : `<span class="chip r">Recommend hold</span>`;
    case 'accounting': return i.catalogId === 'SD-61' ? `<span class="chip a">SD–FI mismatch</span>` : i.configOpen ? `<span class="chip r">Config fix</span>` : `<span class="chip g">Ready to release</span>`;
    case 'pricing': return i.catalogId === 'SD-70' ? `<span class="chip r">No price</span>` : `<span class="chip a">Manual discount</span>`;
  } return '';
}
function statusChip(i) { return { open: '<span class="chip">Open</span>', pending: '<span class="chip a">Pending approval</span>', approved: '<span class="chip b">Approved</span>', assigned: `<span class="chip p">Assigned · ${esc(userName(i.assignee || ''))}</span>`, resolved: '<span class="chip g">Resolved</span>', rejected: '<span class="chip r">Rejected</span>' }[i.status] || ''; }
function actionButton(i) {
  if (!isLive(i)) return '';
  if (i.status === 'pending') return canApprove(i) ? `<button class="btn s p" onclick="event.stopPropagation();openIssue('${i.key}')">Review</button>` : `<span class="mute small">with ${APPROVAL_LABEL[i.approval]}</span>`;
  if (!i.fix) return `<button class="btn s" onclick="event.stopPropagation();openIssue('${i.key}')">${i.assignee ? 'Open' : 'Assign'}</button>`;
  if (needsApproval(i)) return `<button class="btn s" onclick="event.stopPropagation();openIssue('${i.key}')">Propose</button>`;
  const needsInput = i.fix.steps.some(s => s.input && s.input.default === '');
  return canExecute(i) ? `<button class="btn s p" onclick="event.stopPropagation();${needsInput ? `openIssue('${i.key}')` : `execute('${i.key}')`}">${esc(i.fix.label.split(' and ')[0])}</button>` : `<button class="btn s" onclick="event.stopPropagation();openIssue('${i.key}')">Open</button>`;
}
function renderModule(mod) {

  ${extra}

function openDrawer(html, footer = '') { $('#drawer').innerHTML = html + (footer ? `<div class="df">${footer}</div>` : ''); $('#drawer').classList.add('open'); $('#scrim').classList.add('on'); }
function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('on'); DRAWER = null; }
function openIssue(key) {
  const i = issue(key); if (!i) return; DRAWER = { type: 'issue', key };
  const head = `<div class="dh"><div class="grow"><div class="row small" style="margin-bottom:4px"><span class="chip">${esc(MODULES[i.module].label)}</span>${signal(i)}${statusChip(i)}<span class="mute">${esc(i.catalogId)}</span></div><h3>${esc(i.title)}</h3><div class="mute small">${esc(i.detail)}</div></div><button class="btn s" onclick="closeDrawer()">${ICONS.x}</button></div>`;

    </div></div>` : `<div class="note a" style="margin-top:12px"><b>No automated fix.</b> This needs a person — ${i.task ? esc(i.task.title) : 'assign to a consultant'}. Suggested: ${esc(suggestConsultant(i.skill).name)} (${esc(i.skill)}).</div>`;
  const body = `<div class="db">
    ${i.explain ? `<div class="note">${esc(i.explain)}</div>` : ''}
    ${i.refType === 'order' || i.order ? `<button class="btn link small" onclick="openOrder('${i.order || i.ref}')">Open order ${esc(i.order || i.ref)} — full document flow ${ICONS.arrow}</button>` : ''}
    ${(i.evidence || []).map(e => `<div class="ev"><div class="h">${esc(e.h)}</div><pre>${esc(e.text)}</pre></div>`).join('')}
    ${fixCard}
    ${i.assignee ? `<div class="note" style="margin-top:12px">Assigned to <b>${esc(userName(i.assignee))}</b>${i.task ? ' — ' + esc(i.task.title) : ''}</div>` : ''}

  const btns = [];

    if (i.fix) {
      if (i.status === 'pending') { if (canApprove(i)) btns.push(`<button class="btn g" onclick="askNote('Approve','Review reason (required)',v=>decide('${key}',true,v))">Approve</button><button class="btn d" onclick="askNote('Reject','Reason for rejection (required)',v=>decide('${key}',false,v))">Reject</button>`); else btns.push(`<span class="mute small">Waiting for ${APPROVAL_LABEL[i.approval]}${i.proposedBy === me().id ? ' — you proposed this, so you cannot approve it' : ''}</span>`); }
      else if (needsApproval(i)) btns.push(`<button class="btn p" onclick="askNote('Send for approval','Note for the approver (optional)',v=>propose('${key}',v),false)">Send to ${APPROVAL_LABEL[i.approval]}</button>`);
      else if (canExecute(i)) btns.push(`<button class="btn p" onclick="executeFromDrawer('${key}')">${esc(i.fix.label)}</button>`);

  openDrawer(head + body, btns.join(''));

function executeFromDrawer(key) { const inputs = {}; $$('#drawer [data-inp]').forEach(e => inputs[e.dataset.inp] = e.value.trim()); const i = issue(key); const missing = i.fix.steps.flatMap(s => [s.input, s.input2].filter(Boolean)).find(inp => inp.default === '' && !inputs[inp.name]); if (missing) return toast(`${missing.label} is required`, true); execute(key, inputs); }

function track() { const q = ($('#trk').value || '').trim(); if (!q) return; const up = q.toUpperCase(); let o = DB.VBAK.find(v => v.VBELN === q || v.BSTNK.toUpperCase() === up); if (!o) { const d = DB.LIKP.find(x => x.VBELN === q); if (d) o = DB.VBAK.find(v => v.VBELN === (DB.LIPS.find(l => l.VBELN === d.VBELN) || {}).VGBEL); } if (!o) { const inv = DB.VBRP.find(x => x.VBELN === q); if (inv) o = DB.VBAK.find(v => v.VBELN === inv.AUBEL); } if (!o) { const k = DB.KNA1.find(c => c.NAME1.toLowerCase().includes(q.toLowerCase())); if (k) return openCustomer(k.KUNNR); } if (!o) return toast('Nothing found for ' + q, true); openOrder(o.VBELN); }
function orderFlow(o) {
  const items = DB.VBAP.filter(i => i.VBELN === o.VBELN); const eps = DB.VBEP.filter(e => e.VBELN === o.VBELN); const conf = sumBy(eps, e => e.BMENG), ord = sumBy(eps, e => e.WMENG);
  const dl = DB.LIPS.filter(l => l.VGBEL === o.VBELN); const dlv = [...new Set(dl.map(l => l.VBELN))].map(v => DB.LIKP.find(h => h.VBELN === v)); const inv = [...new Set(DB.VBRP.filter(b => b.AUBEL === o.VBELN).map(b => b.VBELN))].map(v => DB.VBRK.find(h => h.VBELN === v));
  const blocks = []; if (o.LIFSK) blocks.push(`delivery block ${o.LIFSK} (${blockText('TVLST', o.LIFSK, 'LIFSP')})`); if (o.FAKSK) blocks.push(`billing block ${o.FAKSK} (${blockText('TVFST', o.FAKSK, 'FAKSP')})`); if (o.CMGST === 'B') blocks.push('credit block (dynamic credit check)'); if (DB.VBUV.some(v => v.VBELN === o.VBELN)) blocks.push('incomplete (' + DB.VBUV.filter(v => v.VBELN === o.VBELN).map(v => v.FDTXT).join(', ') + ')');
  const st = [
    { l: 'Order', v: o.VBELN, m: `${dmy(o.ERDAT)} · ${inr(o.NETWR)}`, c: blocks.length ? 'bad' : 'ok' },
    { l: 'Confirmed', v: `${n(conf)} / ${n(ord)} EA`, m: conf < ord ? `${n(ord - conf)} short` : 'fully confirmed', c: conf === 0 ? 'bad' : conf < ord ? 'warn' : 'ok' },
    { l: 'Delivery', v: dlv.length ? dlv.map(d => d.VBELN).join(', ') : '—', m: dlv.length ? dmy(dlv[0].LFDAT) : (blocks.length ? 'blocked' : 'not created'), c: dlv.length ? 'ok' : blocks.length ? 'bad' : 'todo' },
    { l: 'Goods issue', v: dlv.length ? (dlv.every(d => d.WBSTK === 'C') ? 'posted' : 'pending') : '—', m: dlv.length ? (dlv[0].WADAT_IST ? dmy(dlv[0].WADAT_IST) : dlv[0].PGI_ERR ? 'failed' : 'picked') : '', c: !dlv.length ? 'todo' : dlv.every(d => d.WBSTK === 'C') ? 'ok' : dlv.some(d => d.PGI_ERR) ? 'bad' : 'warn' },
    { l: 'Invoice', v: inv.length ? inv.map(i => i.VBELN).join(', ') : '—', m: inv.length ? dmy(inv[0].FKDAT) + ' · ' + inr(sumBy(inv, i => i.NETWR)) : dlv.some(d => d.WBSTK === 'C') ? (o.FAKSK ? 'billing blocked' : 'due for billing') : '', c: inv.length ? 'ok' : dlv.some(d => d.WBSTK === 'C') ? (o.FAKSK ? 'bad' : 'warn') : 'todo' },
    { l: 'Accounting', v: inv.length ? (inv.every(i => i.RFBSK === 'C') ? inv.map(i => i.BELNR).join(', ') : 'not posted') : '—', m: inv.length ? (inv.every(i => i.RFBSK === 'C') ? 'FI document' : 'posting error') : '', c: !inv.length ? 'todo' : inv.every(i => i.RFBSK === 'C') ? 'ok' : 'bad' },
    { l: 'Output / IRN', v: inv.length ? ((DB.NAST.find(x => x.OBJKY === inv[0].VBELN) || {}).VSTAT === '1' ? 'sent' : 'failed') : (DB.NAST.find(x => x.OBJKY === o.VBELN && x.VSTAT === '2') ? 'order conf. failed' : '—'), m: inv.length ? 'IRN ' + ((DB.EINV.find(e => e.VBELN === inv[0].VBELN) || {}).IRN_STATUS || '—').toLowerCase() : '', c: inv.length ? ((DB.NAST.find(x => x.OBJKY === inv[0].VBELN) || {}).VSTAT === '1' && (DB.EINV.find(e => e.VBELN === inv[0].VBELN) || {}).IRN_STATUS !== 'REJECTED' ? 'ok' : 'bad') : DB.NAST.find(x => x.OBJKY === o.VBELN && x.VSTAT === '2') ? 'bad' : 'todo' },
  ];
  return { items, eps, conf, ord, dlv, inv, blocks, st };
}
function relatedToOrder(i, vbeln) { if (i.ref === vbeln || i.order === vbeln) return true; const dl = DB.LIPS.filter(l => l.VGBEL === vbeln).map(l => l.VBELN); const inv = DB.VBRP.filter(b => b.AUBEL === vbeln).map(b => b.VBELN); const idoc = DB.EDIDC.filter(d => inv.includes(d.OBJKY)).map(d => d.DOCNUM); return [...dl, ...inv, ...idoc].includes(i.ref); }
function orderNarrative(o) {
  const f = orderFlow(o); const k = custName(o.KUNNR); let s = `Order ${o.VBELN} for ${k} (${inr(o.NETWR)}, customer PO ${o.BSTNK}) was created on ${dmy(o.ERDAT)} for delivery by ${dmy(o.VDATU)}. `;
  if (f.blocks.length) s += `It is currently held: ${f.blocks.join('; ')}. `;
  if (f.conf < f.ord) s += `Only ${n(f.conf)} of ${n(f.ord)} EA are confirmed. `;
  if (!f.dlv.length) s += f.blocks.length ? `No delivery can be created until the block is cleared.` : f.conf ? `No delivery has been created yet.` : '';
  else { const d = f.dlv[0]; s += `Delivery ${d.VBELN} was created on ${dmy(d.ERDAT)}; goods issue ${d.WBSTK === 'C' ? `posted on ${dmy(d.WADAT_IST)}` : d.PGI_ERR ? `FAILED (${d.PGI_ERR.split('—')[0].trim()})` : 'is still pending'}. `;
    if (f.inv.length) { const i = f.inv[0]; s += `Invoice ${i.VBELN} (${inr(i.NETWR)} + tax) dated ${dmy(i.FKDAT)} ${i.RFBSK === 'C' ? `is posted to accounting as ${i.BELNR}` : `has NOT posted to accounting: ${i.ACC_ERR.split('—')[0]}`}. `; const nast = DB.NAST.find(x => x.OBJKY === i.VBELN); const ei = DB.EINV.find(e => e.VBELN === i.VBELN); if (nast && nast.VSTAT === '2') s += `The invoice output failed (${nast.ERRTXT.split(':')[0]}). `; if (ei && ei.IRN_STATUS === 'REJECTED') s += `The e-invoice IRN was rejected (${ei.ERRCODE}). `; }
    else if (d.WBSTK === 'C') s += o.FAKSK ? `It cannot be billed because of the billing block.` : `It is due for billing but no invoice exists yet.`; }
  const open = ISSUES.filter(i => isLive(i) && relatedToOrder(i, o.VBELN)); if (open.length) s += ` ${open.length} open item${open.length > 1 ? 's' : ''} in this tool: ${open.map(i => i.fix ? i.fix.label : i.title).join('; ')}.`;
  return s;
}
function openOrder(vbeln) {
  const o = DB.VBAK.find(v => v.VBELN === vbeln); if (!o) return toast('Order not found', true); DRAWER = { type: 'order', vbeln }; const f = orderFlow(o); const kv = DB.KNVV.find(k => k.KUNNR === o.KUNNR) || {};
  const open = ISSUES.filter(i => isLive(i) && relatedToOrder(i, vbeln));
  openDrawer(`<div class="dh"><div class="grow"><div class="row small" style="margin-bottom:4px"><span class="chip b">Order 360°</span><span class="mute">${esc(o.AUART)} · ${esc(orgName(o.VKORG))}</span></div><h3>Order ${esc(vbeln)} · ${esc(custName(o.KUNNR))}</h3><div class="mute small">PO ${esc(o.BSTNK)} · ${inr(o.NETWR)} · created ${dmy(o.ERDAT)} · requested ${dmy(o.VDATU)}</div></div><button class="btn s" onclick="closeDrawer()">${ICONS.x}</button></div>
  <div class="db"><div class="flow">${f.st.map(s => `<div class="st ${s.c}"><div class="l">${s.l}</div><div class="v">${esc(s.v)}</div><div class="m">${esc(s.m)}</div></div>`).join('')}</div>
  <div class="note">${esc(orderNarrative(o))}</div>
  <dl class="kv" style="margin:12px 0"><dt>Customer</dt><dd>${esc(custName(o.KUNNR))} (${o.KUNNR}) · ${esc((DB.KNA1.find(c => c.KUNNR === o.KUNNR) || {}).ORT01)}</dd><dt>Payment terms</dt><dd>${esc(kv.ZTERM || '—')} · Incoterms ${esc(kv.INCO1 || '—')}</dd><dt>Status</dt><dd>${f.blocks.length ? f.blocks.map(b => `<span class="chip r">${esc(b)}</span>`).join(' ') : '<span class="chip g">no blocks</span>'} ${o.CMGST === 'D' ? '<span class="chip g">credit released</span>' : ''}</dd></dl>
  <table class="t"><thead><tr><th>Item</th><th>Material</th><th class="r">Ordered</th><th class="r">Confirmed</th><th class="r">Delivered</th><th class="r">Billed</th><th class="r">Net</th></tr></thead><tbody>${f.items.map(it => { const e = f.eps.filter(x => x.POSNR === it.POSNR); const d = sumBy(DB.LIPS.filter(l => l.VGBEL === vbeln && l.VGPOS === it.POSNR && (DB.LIKP.find(h => h.VBELN === l.VBELN) || {}).WBSTK === 'C'), l => l.LFIMG); const b = sumBy(DB.VBRP.filter(x => x.AUBEL === vbeln && x.AUPOS === it.POSNR), x => x.FKIMG); return `<tr><td class="mono">${it.POSNR}</td><td>${esc(it.MATNR)}<div class="k2">${esc(matName(it.MATNR))} · plant ${it.WERKS}</div></td><td class="r">${n(it.KWMENG)}</td><td class="r ${sumBy(e, x => x.BMENG) < it.KWMENG ? 'amber b' : ''}">${n(sumBy(e, x => x.BMENG))}</td><td class="r">${n(d)}</td><td class="r">${n(b)}</td><td class="r">${it.NETPR ? inrFull(it.NETWR) : '<span class="red b">no price</span>'}</td></tr>`; }).join('')}</tbody></table>
  ${open.length ? `<h4 style="margin:16px 0 6px;font-size:13px">Open items for this order</h4><ul class="list" style="border:1px solid var(--line);border-radius:8px">${open.map(i => `<li style="cursor:pointer" onclick="openIssue('${i.key}')"><span class="n ${i.severity === 'r' ? '' : 'a'}">!</span><span class="grow"><div class="t">${esc(i.title)}</div><div class="d">${i.fix ? esc(i.fix.label) : 'needs consultant'} · ${statusChip(i)}</div></span></li>`).join('')}</ul>` : '<div class="note g" style="margin-top:12px">No open issues on this order.</div>'}
  </div>`, `<button class="btn" onclick="openChat('Where is order ${vbeln}?')">${ICONS.spark} Ask the copilot about this order</button>`);
}
function openCustomer(kunnr) { const k = DB.KNA1.find(c => c.KUNNR === kunnr); const orders = DB.VBAK.filter(o => o.KUNNR === kunnr).sort((a, b) => b.ERDAT.localeCompare(a.ERDAT)); const c = DB.KNKK.find(x => x.KUNNR === kunnr); const open = ISSUES.filter(i => isLive(i) && i.kunnr === kunnr);
  openDrawer(`<div class="dh"><div class="grow"><div class="row small" style="margin-bottom:4px"><span class="chip b">Customer</span></div><h3>${esc(k.NAME1)} · ${kunnr}</h3><div class="mute small">${esc(k.ORT01)} · ${orders.length} orders · ${open.length} open issues</div></div><button class="btn s" onclick="closeDrawer()">${ICONS.x}</button></div><div class="db">
  ${c ? `<dl class="kv"><dt>Credit limit</dt><dd>${inrFull(c.KLIMK)}</dd><dt>Exposure</dt><dd class="${c.SKFOR > c.KLIMK ? 'red' : ''}">${inrFull(c.SKFOR)} (${(c.SKFOR / c.KLIMK * 100).toFixed(0)}%)</dd><dt>Overdue</dt><dd class="${c.OVERDUE ? 'red' : ''}">${inrFull(c.OVERDUE)} · ${c.DPD} days</dd><dt>Payment history</dt><dd>${esc(c.PAYHIST)}</dd></dl>` : ''}
  <table class="t" style="margin-top:12px"><thead><tr><th>Order</th><th>PO</th><th>Created</th><th class="r">Value</th><th>Stage</th></tr></thead><tbody>${orders.map(o => { const f = orderFlow(o); const last = [...f.st].reverse().find(s => s.c === 'ok'); const bad = f.st.find(s => s.c === 'bad'); return `<tr class="click" onclick="openOrder('${o.VBELN}')"><td class="k">${o.VBELN}</td><td>${esc(o.BSTNK)}</td><td>${dmy(o.ERDAT)}</td><td class="r">${inr(o.NETWR)}</td><td>${bad ? `<span class="chip r">${esc(bad.l)}: ${esc(bad.m || bad.v)}</span>` : `<span class="chip g">${esc(last ? last.l : 'Order')}</span>`}</td></tr>`; }).join('')}</tbody></table></div>`);
}

/* ---------- copilot ---------- */
let CHAT = [];
function openChat(q) { DRAWER = { type: 'chat' }; if (!CHAT.length) CHAT.push({ a: true, t: `Hi ${me().name.split(' ')[0]}. Ask me about any order, delivery, invoice or customer, or what is waiting for you. I answer from the SAP tables the tool just read${LLM.endpoint ? ' and the connected language model' : ''}.` }); renderChat(); if (q) chatSend(q); }
function renderChat() { openDrawer(`<div class="dh"><div class="grow"><h3 class="row">${ICONS.spark} SD copilot</h3><div class="mute small">grounded on your scoped SAP data · ${LLM.endpoint ? 'LLM connected' : 'rule-based (connect an LLM endpoint in Data & connections)'}</div></div><button class="btn s" onclick="closeDrawer()">${ICONS.x}</button></div><div class="db"><div class="chat" id="chat">${CHAT.map(m => `<div class="msg ${m.a ? 'a' : 'u'}">${esc(m.t)}</div>`).join('')}</div><div class="sugg" style="margin-top:12px">${['Where is order 50001291?', 'Why is 50001286 blocked?', 'What is delivered but not billed?', 'Which IDocs failed?', 'Who is free to take a task?', 'What needs my approval?'].map(s => `<button onclick="chatSend('${s.replace(/'/g, "\\'")}')">${s}</button>`).join('')}</div></div>`, `<input id="chatIn" class="grow" placeholder="Ask about an order, customer, invoice…" onkeydown="if(event.key==='Enter')chatSend(this.value)"><button class="btn p" onclick="chatSend(document.getElementById('chatIn').value)">Send</button>`); const c = $('#chat'); if (c) c.scrollTop = 1e6; const inp = $('#chatIn'); if (inp) inp.focus(); }
async function chatSend(q) { q = (q || '').trim(); if (!q) return; CHAT.push({ a: false, t: q }); renderChat(); let a; try { a = LLM.endpoint ? (await (await fetch(LLM.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, context: copilotContext() }) })).json()).answer : copilotAnswer(q); } catch (e) { a = 'LLM endpoint failed (' + e.message + '). Falling back:\n\n' + copilotAnswer(q); } CHAT.push({ a: true, t: a }); audit('Copilot: ' + q); saveState(); renderChat(); }
function copilotContext() { return { user: me().name, role: role().title, openIssues: live().map(i => ({ key: i.key, title: i.title, detail: i.detail, status: i.status })), orders: DB.VBAK.map(o => ({ ...o, narrative: orderNarrative(o) })) }; }
function copilotAnswer(q) {
  const t = q.toLowerCase(); const num = q.match(/\b(5000\d{4}|8000\d{4}|9000\d{4})\b/); const L = live();
  if (num) { let o; if (num[1].startsWith('5000')) o = DB.VBAK.find(v => v.VBELN === num[1]); else if (num[1].startsWith('8000')) { const l = DB.LIPS.find(x => x.VBELN === num[1]); o = l && DB.VBAK.find(v => v.VBELN === l.VGBEL); } else { const b = DB.VBRP.find(x => x.VBELN === num[1]); o = b && DB.VBAK.find(v => v.VBELN === b.AUBEL); }
    if (!o) return `I cannot find ${num[1]} in the sales organisations you are authorised for.`; const open = L.filter(i => relatedToOrder(i, o.VBELN)); return orderNarrative(o) + (open.length ? `\n\nNext step: ${open[0].fix ? open[0].fix.label + (needsApproval(open[0]) ? ` (needs ${APPROVAL_LABEL[open[0].approval]})` : canExecute(open[0]) ? ' — you can do it from the issue' : '') : 'assign to ' + suggestConsultant(open[0].skill).name}.` : '\n\nNothing is waiting on this order.'); }
  const cust = DB.KNA1.find(k => t.includes(k.NAME1.split(' ')[0].toLowerCase())); if (cust) { const os = DB.VBAK.filter(o => o.KUNNR === cust.KUNNR); const open = L.filter(i => i.kunnr === cust.KUNNR); const c = DB.KNKK.find(x => x.KUNNR === cust.KUNNR); return `${cust.NAME1}: ${os.length} orders worth ${inr(sumBy(os, o => o.NETWR))}; credit exposure ${inr(c.SKFOR)} of ${inr(c.KLIMK)}${c.OVERDUE ? `, ${inr(c.OVERDUE)} overdue (${c.DPD} days)` : ', nothing overdue'}.\n\n${open.length ? `Open items (${open.length}):\n` + open.map(i => `• ${i.title}`).join('\n') : 'No open issues.'}`; }
  if (/block/.test(t)) { const b = L.filter(i => ['SD-01', 'SD-50'].includes(i.catalogId)); return b.length ? `${b.length} orders are blocked:\n` + b.map(i => `• ${i.title} — ${i.explain.split('.')[0]}.`).join('\n') : 'No orders are blocked right now.'; }
  if (/bill|invoice backlog|not billed|unbilled/.test(t)) { const b = L.filter(i => i.module === 'billing'); return b.length ? `${inr(sumBy(b, i => i.value))} is delivered but not billed across ${b.length} deliveries. ${b.filter(i => !i.approval).length} can be billed now with one click; ${b.filter(i => i.approval).length} need a billing block removed first (SD Lead).\n` + b.map(i => `• ${i.ref} ${custName(i.kunnr)} ${inr(i.value)} — ${i.approval ? 'blocked' : 'clean'}`).join('\n') : 'Everything delivered has been billed.'; }
  if (/credit/.test(t)) { const b = L.filter(i => i.module === 'credit'); return b.length ? b.map(i => `• ${i.title}\n  ${i.explain}`).join('\n\n') : 'No credit blocks.'; }
  if (/idoc|output|e-?invoice|irn|edi/.test(t)) { const b = L.filter(i => i.module === 'output'); return b.length ? b.map(i => `• ${i.title} — ${i.detail}`).join('\n') : 'All outputs and IDocs are fine.'; }
  if (/approv/.test(t)) { const p = ISSUES.filter(i => i.status === 'pending' && inOrg(i)); const mine = p.filter(canApprove); return `${p.length} items are pending approval, ${mine.length} are for you.` + (mine.length ? '\n' + mine.map(i => `• ${i.fix.label} — ${i.ref} ${custName(i.kunnr)} ${inr(i.value)}, proposed by ${userName(i.proposedBy)}`).join('\n') : ''); }
  if (/free|load|consultant|who can/.test(t)) { const l = consultantLoad(); return CONSULTANTS.sort((a, b) => l[a.id] - l[b.id]).map(c => `• ${c.name} — ${l[c.id]} / ${c.capacity} open tasks (${c.skills.join(', ')})`).join('\n') + `\n\n${CONSULTANTS[0].name} has the most room.`; }
  if (/\bpo\b|inbox|purchase order/.test(t)) { const b = L.filter(i => i.module === 'po'); return b.length ? b.map(i => `• ${i.title}`).join('\n') : 'The PO inbox is empty.'; }
  if (/pric/.test(t)) { const b = L.filter(i => i.module === 'pricing'); return b.length ? b.map(i => `• ${i.title}\n  ${i.explain}`).join('\n\n') : 'No pricing issues.'; }
  if (/account|post|fi\b/.test(t)) { const b = L.filter(i => i.module === 'accounting'); return b.length ? b.map(i => `• ${i.title}\n  ${i.explain}`).join('\n\n') : 'All invoices are posted.'; }
  if (/wait|open|issue|today|summary|what/.test(t)) return `${L.length} open issues: ` + Object.keys(MODULES).filter(m => live(m).length).map(m => `${live(m).length} ${MODULES[m].label.toLowerCase()}`).join(', ') + `.\n\nMost urgent:\n` + [...L].filter(i => i.severity === 'r').slice(0, 5).map(i => `• ${i.title}`).join('\n');
  return `I can answer about a specific document (give me the order, delivery or invoice number), a customer by name, or a topic: blocked orders, billing backlog, credit, outputs/IDocs, PO inbox, pricing, accounting, approvals, consultant load.`;
}

/* ---------- modal helpers ---------- */
function modal(title, body, footer) { $('#modal').innerHTML = `<div class="box"><div class="mh">${title}</div><div class="mb">${body}</div><div class="mf"><button class="btn" onclick="closeModal()">Cancel</button>${footer}</div></div>`; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
function askNote(title, label, cb, required = true) { modal(title, `<label class="small"><div class="mute">${esc(label)}</div><textarea id="noteIn" rows="3" style="width:100%"></textarea></label>`, `<button class="btn p" onclick="const v=document.getElementById('noteIn').value.trim();if(${required}&&!v){toast('A reason is required',true);return}closeModal();(${cb.toString()})(v)">Confirm</button>`); setTimeout(() => $('#noteIn').focus(), 50); }

/* ---------- boot ---------- */
(async function boot() {
  loadDB(); loadState(); document.documentElement.setAttribute('data-theme', S.theme);
  if (S.user) { S.user = USERS.find(u => u.id === S.user.id) || null; }
  if (S.user) { await scan(); }
  refresh();
})();

</script>
